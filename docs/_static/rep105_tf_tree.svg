<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="360" y="36" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="18" font-weight="bold">REP-105 TF composition (camera correction)</text>

  <rect x="280" y="70" width="160" height="56" rx="12" ry="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="106" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="18" font-weight="bold">map</text>

  <line x1="360" y1="126" x2="360" y2="170" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="420" y="158" fill="#374151" font-family="sans-serif" font-size="14">map to odom TF</text>
  <text x="420" y="178" fill="#374151" font-family="sans-serif" font-size="14">(jumps at camera keyframes)</text>

  <rect x="280" y="190" width="160" height="56" rx="12" ry="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="360" y="226" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="18" font-weight="bold">odom</text>

  <line x1="360" y1="246" x2="360" y2="290" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="420" y="278" fill="#374151" font-family="sans-serif" font-size="14">odom to base_link TF</text>
  <text x="420" y="298" fill="#374151" font-family="sans-serif" font-size="14">(pure LIO, smooth)</text>

  <rect x="280" y="310" width="160" height="56" rx="12" ry="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="360" y="346" text-anchor="middle" fill="#111827" font-family="sans-serif" font-size="18" font-weight="bold">base_link</text>

  <text x="40" y="120" fill="#374151" font-family="sans-serif" font-size="14">Global consumers:</text>
  <text x="40" y="142" fill="#374151" font-family="sans-serif" font-size="14">use map to base_link</text>
  <text x="40" y="164" fill="#374151" font-family="sans-serif" font-size="14">(includes camera delta).</text>

  <text x="520" y="120" fill="#374151" font-family="sans-serif" font-size="14">Local control:</text>
  <text x="520" y="142" fill="#374151" font-family="sans-serif" font-size="14">listen on odom to base_link</text>
  <text x="520" y="164" fill="#374151" font-family="sans-serif" font-size="14">(smooth, no jumps).</text>
</svg>
