<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320">
  <text x="440" y="34" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Gauss-Newton iteration inside icp(...) when camera_ctx is active</text>
  <text x="440" y="58" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Primary scan ICP uses camera_ctx = nullptr (first two blocks only).</text>

  <rect x="40" y="100" width="200" height="110" rx="10" ry="10" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">H_icp, b_icp</text>
  <text x="140" y="160" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Point-to-map</text>
  <text x="140" y="182" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Weighted by w_dyn</text>

  <text x="270" y="165" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="22">+</text>

  <rect x="300" y="100" width="200" height="110" rx="10" ry="10" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="135" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">H_ori / beta</text>
  <text x="400" y="162" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Gravity regularization</text>
  <text x="400" y="184" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">(optional)</text>

  <text x="530" y="165" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="22">+</text>

  <rect x="560" y="100" width="200" height="110" rx="10" ry="10" fill="#fef9c3" stroke="#854d0e" stroke-width="2"/>
  <text x="660" y="135" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">H_cam, b_cam</text>
  <text x="660" y="160" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Edge DT residual</text>
  <text x="660" y="182" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Huber + 1/N_vis</text>

  <text x="780" y="165" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="22">=&gt;</text>

  <rect x="800" y="100" width="60" height="110" rx="14" ry="14" fill="#ede9fe" stroke="#5b21b6" stroke-width="2"/>
  <text x="830" y="160" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">H</text>

  <text x="440" y="260" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Solve H * dx = -b; then T &lt;- exp(dx) * T (left perturbation in odom)</text>
  <text x="440" y="288" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="12">Camera: r = DT(u); J = grad_DT * du/dp_c * dp_c/dxi (bilinear grad_DT)</text>
</svg>
